<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seite nicht gefunden | Ventari</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="/fonts/dm-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/dm-serif-display-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    :root{--bg:#07080f;--bg2:#0c0e18;--blue:#4a8cff;--white:#f4f6fb;--muted:#8b93b3;--border:rgba(74,140,255,.15)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;background:var(--bg);color:var(--white);font-family:"DM Sans",sans-serif;line-height:1.7;display:grid;place-items:center;padding:2rem}
    main{width:min(680px,100%);border:1px solid var(--border);background:var(--bg2);border-radius:12px;padding:clamp(2rem,6vw,4rem)}
    .eyebrow{color:var(--blue);font-size:.7rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin-bottom:1rem}
    h1{font-family:"DM Serif Display",serif;font-size:clamp(2.4rem,7vw,4rem);font-weight:400;line-height:1.08;margin-bottom:1rem}
    p{color:var(--muted);max-width:50ch;margin-bottom:2rem}
    a{display:inline-flex;background:var(--blue);color:var(--bg);padding:.85rem 1.4rem;border-radius:6px;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">404</p>
    <h1>Diese Seite gibt es nicht.</h1>
    <p>Die angeforderte URL wurde nicht gefunden. Nutzen Sie die Startseite, um zu den Ventari-Leistungen, Tools oder Artikeln zurückzukehren.</p>
    <a href="/">Zur Startseite</a>
  </main>
</body>
</html>
